services:
  web:
    build: .
    image: visitor-counter:local
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      CLUSTER_ID: Docker Compose
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  redis-data:
